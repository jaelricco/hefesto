# Production topology, deliberately the same shape as the development stack.
#
# Differences from docker-compose.yml:
#   - api runs a published image, never a build context
#   - Caddy terminates TLS and is the only thing bound to a public port
#   - Postgres is NOT published; it is reachable only on the internal network
#   - no mailpit, no pgweb, no minio (Hetzner Object Storage replaces MinIO)
#   - a backup sidecar dumps the database to object storage nightly
#   - Postgres archives every WAL segment with pgBackRest and a pitr sidecar
#     takes base backups, for point-in-time recovery (ADR 0026)
#   - Caddy also serves staging (docker-compose.staging.yml, ADR 0026) over
#     the shared hefesto-edge network
#
# Used on the server as:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod <cmd>

name: hefesto

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# pgBackRest's settings, shared by Postgres (which pushes WAL with them) and
# the pitr sidecar (which takes base backups). The repository is encrypted:
# without HEFESTO_PITR_CIPHER_PASS the backups cannot be read, so keep a copy
# of it off the server.
x-pgbackrest: &pgbackrest
  PGBACKREST_STANZA: hefesto
  PGBACKREST_PG1_PATH: /var/lib/postgresql/data
  PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
  PGBACKREST_PG1_USER: ${POSTGRES_USER:?}
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_PATH: /pgbackrest
  PGBACKREST_REPO1_S3_ENDPOINT: ${HEFESTO_PITR_S3_ENDPOINT:?}
  PGBACKREST_REPO1_S3_REGION: ${HEFESTO_PITR_S3_REGION:?}
  PGBACKREST_REPO1_S3_BUCKET: ${HEFESTO_PITR_S3_BUCKET:?}
  PGBACKREST_REPO1_S3_KEY: ${HEFESTO_PITR_S3_KEY:?}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${HEFESTO_PITR_S3_KEY_SECRET:?}
  PGBACKREST_REPO1_S3_URI_STYLE: ${HEFESTO_PITR_S3_URI_STYLE:-path}
  PGBACKREST_REPO1_STORAGE_PORT: ${HEFESTO_PITR_S3_PORT:-443}
  PGBACKREST_REPO1_STORAGE_VERIFY_TLS: ${HEFESTO_PITR_VERIFY_TLS:-y}
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${HEFESTO_PITR_CIPHER_PASS:?}
  PGBACKREST_REPO1_RETENTION_FULL: ${HEFESTO_PITR_RETENTION_FULL:-2}
  PGBACKREST_COMPRESS_TYPE: zst
  PGBACKREST_LOG_LEVEL_CONSOLE: info
  PGBACKREST_LOG_LEVEL_FILE: "off"
  PGBACKREST_LOCK_PATH: /tmp/pgbackrest

services:
  postgres:
    # postgres:16-alpine plus pgBackRest, built here (docker/Dockerfile.postgres).
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: hefesto-postgres:16
    restart: unless-stopped
    environment:
      <<: *pgbackrest
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Shared with the pitr sidecar, which talks to the server over the socket.
      - pgsocket:/var/run/postgresql
    # No ports: — the database is not reachable from outside the compose network.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "max_connections=60"
      - "-c"
      - "log_min_duration_statement=500"
      # Every WAL segment goes to the pgBackRest repository, at the latest a
      # minute after it began: the most a restore can lose.
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest archive-push %p"
      - "-c"
      - "archive_timeout=60"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  # One-shot. scripts/deploy.sh runs this to completion before touching the API.
  migrate:
    image: ${HEFESTO_IMAGE:?}:${HEFESTO_TAG:?}
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?}
      GOOSE_MIGRATION_DIR: /srv/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  # One-shot. scripts/deploy.sh runs this after migrate, before the API. It
  # imports the content tree baked into the image; unchanged content is a no-op.
  seed:
    image: ${HEFESTO_IMAGE:?}:${HEFESTO_TAG:?}
    entrypoint: ["/usr/local/bin/seed"]
    command: ["-dir", "/srv/content"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: ${HEFESTO_IMAGE:?}:${HEFESTO_TAG:?}
    restart: unless-stopped
    # required:false so that `make deploy-check` can validate this file on a
    # machine that has no production secrets. Presence is enforced where it
    # matters instead: scripts/deploy.sh refuses to run without .env.prod, and
    # internal/config rejects a prod process with no signing key.
    env_file:
      - path: .env.prod
        required: false
    environment:
      HEFESTO_ENV: prod
      HEFESTO_HTTP_ADDR: ":8080"
      HEFESTO_LOG_FORMAT: json
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HEFESTO_API_DOMAIN: ${HEFESTO_API_DOMAIN:?}
      HEFESTO_SITE_DOMAIN: ${HEFESTO_SITE_DOMAIN:?}
      HEFESTO_SITE_DOMAIN_ALT: ${HEFESTO_SITE_DOMAIN_ALT:?}
      HEFESTO_STAGING_API_DOMAIN: ${HEFESTO_STAGING_API_DOMAIN:?}
      HEFESTO_ACME_EMAIL: ${HEFESTO_ACME_EMAIL:?}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default: {}
      edge: {}
    depends_on:
      - api
    logging: *default-logging

  backup:
    image: ${HEFESTO_IMAGE:?}:${HEFESTO_TAG:?}
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/srv/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      HEFESTO_BACKUP_BUCKET: ${HEFESTO_BACKUP_BUCKET:?}
      HEFESTO_BACKUP_ENDPOINT: ${HEFESTO_BACKUP_ENDPOINT:?}
      HEFESTO_BACKUP_ACCESS_KEY: ${HEFESTO_BACKUP_ACCESS_KEY:?}
      HEFESTO_BACKUP_SECRET_KEY: ${HEFESTO_BACKUP_SECRET_KEY:?}
      HEFESTO_BACKUP_INTERVAL_S: ${HEFESTO_BACKUP_INTERVAL_S:-86400}
      HEFESTO_BACKUP_RETAIN_DAYS: ${HEFESTO_BACKUP_RETAIN_DAYS:-30}
    volumes:
      - ./scripts/backup.sh:/srv/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Base backups for point-in-time recovery (scripts/pitr.sh, ADR 0026): a
  # full backup weekly, a differential daily. It reads the data directory
  # read-only and reaches Postgres over the shared socket.
  pitr:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: hefesto-postgres:16
    restart: unless-stopped
    user: postgres
    entrypoint: ["/bin/sh", "/srv/pitr.sh"]
    environment:
      <<: *pgbackrest
      HEFESTO_PITR_INTERVAL_S: ${HEFESTO_PITR_INTERVAL_S:-86400}
      HEFESTO_PITR_FULL_EVERY_S: ${HEFESTO_PITR_FULL_EVERY_S:-604800}
      PGUSER: ${POSTGRES_USER:?}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgsocket:/var/run/postgresql
      - ./scripts/pitr.sh:/srv/pitr.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

networks:
  # Shared with the staging project, whose API Caddy proxies to. Created by
  # scripts/deploy.sh when missing.
  edge:
    name: hefesto-edge
    external: true

volumes:
  pgdata:
  pgsocket:
  caddy_data:
  caddy_config:
