# XcodeGen spec for the Hefesto iOS app (ADR 0010). The .xcodeproj is
# generated from this file and not committed:
#
#   brew install xcodegen && cd ios && xcodegen generate && open Hefesto.xcodeproj
#
# The app target holds only SwiftUI views; everything else lives in the local
# package Packages/HefestoKit.
name: Hefesto
options:
  bundleIdPrefix: fit.hefesto
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HefestoKit:
    path: Packages/HefestoKit
targets:
  Hefesto:
    type: application
    platform: iOS
    sources:
      - path: Hefesto
    dependencies:
      - package: HefestoKit
        product: HefestoAPI
      - package: HefestoKit
        product: HefestoStore
      - package: HefestoKit
        product: HefestoAuth
      - package: HefestoKit
        product: HefestoSync
      - package: HefestoKit
        product: HefestoLogger
    entitlements:
      path: Hefesto/Hefesto.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Hefesto/Info.plist
      properties:
        CFBundleDisplayName: Hefesto
        # English and German (brief §10); strings are in Localizable.xcstrings.
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The API the app talks to, set per configuration below.
        HefestoAPIBaseURL: $(HEFESTO_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fit.hefesto.ios
      configs:
        Debug:
          HEFESTO_API_BASE_URL: http://localhost:8080
        Release:
          HEFESTO_API_BASE_URL: https://api.hefesto.fit
    scheme:
      testTargets: [HefestoUITests]
      gatherCoverageData: false

  # Apple's accessibility audit over every main screen, on the app's offline
  # fixture (Hefesto/UITestFixture.swift, Debug only).
  HefestoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HefestoUITests
    dependencies:
      - target: Hefesto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fit.hefesto.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
