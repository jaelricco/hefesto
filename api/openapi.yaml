      description: |
        The plan of the current week, generated on first use; plans change
        only on events. `week` asks for an earlier week's plan as it ended.
        A plan whose training is stopped (SAFE-02, SAFE-07) has
        `stopped: true`, no sessions, and says why. The `ETag` names this
