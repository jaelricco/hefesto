  /v1/me/health-consent:
    post:
      tags: [planning]
      operationId: changeHealthConsent
      summary: Grant or withdraw the consent to keep health data
      description: |
        Health data are the complaints, pain reports, region states and
        screening answers. A withdrawal deletes them. What protects the
        athlete stays as a constraint without answers or values: a locked
        region stays locked, a region with a complaint stays excluded and a
        stop stays (spec §4.9). Without the consent the planner plans more
        cautiously (SAFE-04).

        A grant asks again what was not kept: the six screening questions
        and the regions injured in the last 12 months. Every excluded region
        then enters stage 0 of the return ramp, which green daily pain and
        negative red flags lead out of. Granting or withdrawing what is
        already in place changes nothing. Idempotent by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthConsentChange"
      responses:
        "200":
          description: What the change did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEventResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/me/capacity:
    get:
      tags: [planning]
      operationId: listMyCapacities
      summary: What the planner estimates I can do, with its confidence
      description: |
        One estimate per exercise and assistance: the mean and spread of the
        maximal reps or hold time, where it comes from and how sure the
        planner is (spec §4.3). Wide estimates are dosed conservatively;
        a logged set narrows them.
      responses:
        "200":
          description: The estimates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityList"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /v1/planner/rules:
    get:
      tags: [planning]
      operationId: listPlannerRules
      summary: The rule catalogue behind every explanation
      security: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The rules. The `ETag` is the ruleset version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerRuleList"
        "304":
          description: The catalogue has not changed.
        "503":
          $ref: "#/components/responses/Problem"

  /v1/planner/sources:
    get:
      tags: [planning]
      operationId: listPlannerSources
      summary: The sources the rules and parameters cite
      security: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The sources. The `ETag` is the ruleset version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerSourceList"
        "304":
          description: The catalogue has not changed.
        "503":
          $ref: "#/components/responses/Problem"

  /v1/planner/parameters:
    get:
      tags: [planning]
      operationId: listPlannerParameters
      summary: The parameters the rules use, with their values and evidence
      security: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The parameters. The `ETag` is the ruleset version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerParameterList"
        "304":
          description: The catalogue has not changed.
        "503":
          $ref: "#/components/responses/Problem"

  /v1/planner/catalogue:
    get:
      tags: [planning]
      operationId: getPlannerCatalogue
      summary: Skills, exercises, regions and answer classes of the planner
      description: |
        What a client needs to ask the onboarding and to show a plan: the
        planner's skills with their levels and stage classes, its exercises,
        the body-map regions with their red-flag questions, and the answer
        classes. The planner's skills and exercises are its own knowledge
        base, not yet the content catalogue of `/v1/skills`.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The catalogue. The `ETag` is the ruleset version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerCatalogue"
        "304":
          description: The catalogue has not changed.
        "503":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    SetId:
      name: setId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    BandId:
      name: bandId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-chosen key, unique per logical request, kept for 24 hours. A UUID is a good choice.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: "^[\\x21-\\x7E]+$"
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A client-chosen key, unique per logical request, kept for 24 hours. With it a retry returns the first response.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: "^[\\x21-\\x7E]+$"
    PlannedSessionId:
      name: plannedSessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    Region:
      name: region
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RegionId"

  responses:
    Problem:
      description: An error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # -------------------------------------------------------------- basics
    Id:
      description: A UUID. Rows a client creates carry a client-generated UUIDv7.
      type: string
      format: uuid
    Slug:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 80
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    TimeZone:
      description: An IANA time-zone name.
      type: string
      minLength: 1
      maxLength: 64
      examples: [Europe/Zurich]
    Measure:
      type: string
      enum: [reps, hold_seconds, distance_m, none]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        commit:
          type: string

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        trace_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string

    # ---------------------------------------------------------------- auth
    Device:
      description: |
        The device signing in. Its `id` becomes the `client_id` on every row
        written with the resulting tokens, and signing out revokes only this
        device's tokens.
      type: object
      additionalProperties: false
      required: [id, platform]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        platform:
          type: string
          enum: [ios, android, web]
        model:
          type: string
          maxLength: 100
        os_version:
          type: string
          maxLength: 40
        app_version:
          type: string
          maxLength: 40

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 256
        display_name:
          type: string
          maxLength: 80
        locale:
          type: string
          maxLength: 20
          examples: [de-CH]
        timezone:
          $ref: "#/components/schemas/TimeZone"
        device:
          $ref: "#/components/schemas/Device"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
        device:
          $ref: "#/components/schemas/Device"

    AppleSignInRequest:
      type: object
      additionalProperties: false
      required: [identity_token]
      properties:
        identity_token:
          description: The JWT from `ASAuthorizationAppleIDCredential.identityToken`.
          type: string
          maxLength: 8192
        nonce:
          description: The raw nonce whose SHA-256 was sent to Apple, if one was.
          type: string
          maxLength: 256
        display_name:
          description: Apple only reveals the name on the first sign-in; send it then.
          type: string
          maxLength: 80
        device:
          $ref: "#/components/schemas/Device"

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          maxLength: 200

    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          description: Access-token lifetime in seconds.
          type: integer
        refresh_token:
          type: string
        refresh_expires_at:
          $ref: "#/components/schemas/Timestamp"
        user:
          $ref: "#/components/schemas/User"
        deletion_cancelled:
          description: True when this sign-in cancelled a pending account deletion.
          type: boolean

    # ------------------------------------------------------------------ me
    User:
      type: object
      required: [id, email, email_verified, display_name, locale, unit_system, week_start, timezone, status, deletion_requested_at, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        email:
          type: [string, "null"]
        email_verified:
          type: boolean
        display_name:
          type: string
        locale:
          type: string
        unit_system:
          type: string
          enum: [metric, imperial]
        week_start:
          description: ISO weekday the week starts on; 1 is Monday.
          type: integer
          minimum: 1
          maximum: 7
        timezone:
          $ref: "#/components/schemas/TimeZone"
        status:
          type: string
          enum: [active, suspended, deletion_pending]
        deletion_requested_at:
          $ref: "#/components/schemas/NullableTimestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          maxLength: 80
        locale:
          type: string
          minLength: 2
          maxLength: 20
        unit_system:
          type: string
          enum: [metric, imperial]
        week_start:
          type: integer
          minimum: 1
          maximum: 7
        timezone:
          $ref: "#/components/schemas/TimeZone"

    DeletionScheduled:
      type: object
      required: [deletion_requested_at, hard_delete_after]
      properties:
        deletion_requested_at:
          $ref: "#/components/schemas/Timestamp"
        hard_delete_after:
          $ref: "#/components/schemas/Timestamp"

    # ----------------------------------------------------------- exercises
    Exercise:
      type: object
      required: [id, slug, name, aka, family, default_measure, load_semantics, is_bodyweight, unilateral, tempo_applicable, equipment, summary, cues, common_faults, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        aka:
          type: array
          items:
            type: string
        family:
          $ref: "#/components/schemas/Slug"
        default_measure:
          $ref: "#/components/schemas/Measure"
        load_semantics:
          type: string
          enum: [added, external, none]
        is_bodyweight:
          type: boolean
        unilateral:
          type: boolean
        tempo_applicable:
          type: boolean
        equipment:
          type: array
          items:
            type: string
        summary:
          type: string
        cues:
          type: array
          items:
            type: string
        common_faults:
          type: array
          items:
            type: string
        status:
          description: "`draft_placeholder` marks content that is not yet researched."
          type: string
          enum: [active, draft_placeholder]

    ExerciseList:
      type: object
      required: [items, content_version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        content_version:
          description: Checksum of the content tree these exercises come from.
          type: string

    # --------------------------------------------------------------- bands
    Band:
      type: object
      required: [id, owner, brand, colour_label, resistance_min_kg, resistance_max_kg, length_cm, thickness_mm]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        owner:
          type: string
          enum: [catalogue, mine]
        brand:
          type: string
        colour_label:
          type: string
        resistance_min_kg:
          type: number
        resistance_max_kg:
          type: number
        length_cm:
          type: [number, "null"]
        thickness_mm:
          type: [number, "null"]

    BandList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Band"

    BandCreate:
      type: object
      additionalProperties: false
      required: [id, brand, colour_label, resistance_min_kg, resistance_max_kg]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        brand:
          type: string
          minLength: 1
          maxLength: 80
        colour_label:
          type: string
          minLength: 1
          maxLength: 80
        resistance_min_kg:
          type: number
          minimum: 0
          maximum: 999
        resistance_max_kg:
          type: number
          minimum: 0
          maximum: 999
        length_cm:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        thickness_mm:
          type: number
          exclusiveMinimum: 0
          maximum: 1000

    # ------------------------------------------------------------ sessions
    SessionCreate:
      type: object
      additionalProperties: false
      required: [id, started_at, timezone]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        timezone:
          $ref: "#/components/schemas/TimeZone"
        title:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 10000
        bodyweight_kg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        is_rest_day:
          description: A planned rest day logged as a session; it maintains the streak (ADR 0003).
          type: boolean
        template_id:
          $ref: "#/components/schemas/Id"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    SessionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          $ref: "#/components/schemas/TimeZone"
        title:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 10000
        perceived_fatigue:
          type: [integer, "null"]
          minimum: 1
          maximum: 10
        bodyweight_kg:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 500
        is_rest_day:
          type: boolean
        status:
          description: A draft may be abandoned, and an abandoned session reopened. Completion is a separate endpoint.
          type: string
          enum: [draft, abandoned]
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    SessionStatus:
      type: string
      enum: [draft, completed, abandoned]

    Session:
      type: object
      required: [id, started_at, ended_at, timezone, local_date, title, notes, perceived_fatigue, bodyweight_kg, status, is_rest_day, template_id, planned_session_id, completed_at, updated_at, server_updated_at, blocks]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          $ref: "#/components/schemas/TimeZone"
        local_date:
          type: string
          format: date
        title:
          type: string
        notes:
          type: string
        perceived_fatigue:
          type: [integer, "null"]
        bodyweight_kg:
          type: [number, "null"]
        status:
          $ref: "#/components/schemas/SessionStatus"
        is_rest_day:
          type: boolean
        template_id:
          type: [string, "null"]
          format: uuid
        planned_session_id:
          description: The planned session the session was started from.
          type: [string, "null"]
          format: uuid
        completed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        server_updated_at:
          $ref: "#/components/schemas/Timestamp"
        blocks:
          description: Live blocks in order, each with its live sets in order.
          type: array
          items:
            $ref: "#/components/schemas/Block"

    SessionSummary:
      type: object
      required: [id, started_at, ended_at, timezone, local_date, title, status, is_rest_day, block_count, set_count]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          $ref: "#/components/schemas/TimeZone"
        local_date:
          type: string
          format: date
        title:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        is_rest_day:
          type: boolean
        block_count:
          type: integer
        set_count:
          type: integer

    SessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        next_cursor:
          type: [string, "null"]

    BlockKind:
      type: string
      enum: [straight, superset, circuit, emom, amrap]

    BlockWrite:
      type: object
      additionalProperties: false
      required: [order_index]
      properties:
        order_index:
          type: integer
          minimum: 0
          maximum: 9999
        kind:
          $ref: "#/components/schemas/BlockKind"
        rounds_planned:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
        rounds_done:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000
        interval_s:
          description: EMOM window or AMRAP cap. Only for `emom` and `amrap` blocks.
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
        notes:
          type: string
          maxLength: 10000
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    Block:
      type: object
      required: [id, order_index, kind, rounds_planned, rounds_done, interval_s, notes, updated_at, sets]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        order_index:
          type: integer
        kind:
          $ref: "#/components/schemas/BlockKind"
        rounds_planned:
          type: [integer, "null"]
        rounds_done:
          type: [integer, "null"]
        interval_s:
          type: [integer, "null"]
        notes:
          type: string
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SetEntry"

    SetKind:
      type: string
      enum: [working, warmup, backoff, drop, cluster, test]

    SetEntryWrite:
      type: object
      additionalProperties: false
      required: [block_id, order_index, elements]
      properties:
        block_id:
          $ref: "#/components/schemas/Id"
        order_index:
          type: integer
          minimum: 0
          maximum: 9999
        round_index:
          description: For circuits, which round this set belongs to. Each round is its own set entry.
          type: [integer, "null"]
          minimum: 0
          maximum: 1000
        kind:
          $ref: "#/components/schemas/SetKind"
        is_planned:
          description: True for a set that is planned but not yet performed.
          type: boolean
        rest_after_planned_s:
          type: [integer, "null"]
          minimum: 0
          maximum: 86400
        rest_after_actual_s:
          type: [integer, "null"]
          minimum: 0
          maximum: 86400
        rpe:
          type: [number, "null"]
          minimum: 1
          maximum: 10
        rir:
          type: [integer, "null"]
          minimum: 0
          maximum: 10
        completed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        notes:
          type: string
          maxLength: 10000
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        elements:
          description: The complete ordered list. One element for a plain set, several for a combo.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/SetElementWrite"

    SetElementWrite:
      type: object
      additionalProperties: false
      required: [id, exercise_id, measure]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        exercise_id:
          $ref: "#/components/schemas/Id"
        measure:
          $ref: "#/components/schemas/Measure"
        reps:
          description: Only with `measure = reps`.
          type: [integer, "null"]
          minimum: 0
          maximum: 10000
        hold_seconds:
          description: Only with `measure = hold_seconds`.
          type: [number, "null"]
          minimum: 0
          maximum: 36000
        distance_m:
          description: Only with `measure = distance_m`.
          type: [number, "null"]
          minimum: 0
          maximum: 100000
        tempo:
          description: Four characters, digits or `X`, e.g. `30X1`.
          type: [string, "null"]
          pattern: "^[0-9X]{4}$"
        load_kg:
          description: Added external load. Never negative — assistance, a counterweight included, goes in `assistance`.
          type: number
          minimum: 0
          maximum: 1000
        is_eccentric_only:
          type: boolean
        is_partial_rom:
          type: boolean
        rom_note:
          description: Only with `is_partial_rom`.
          type: [string, "null"]
          maxLength: 500
        form_quality:
          description: 1 (poor) to 5 (textbook). Drives unlock confidence.
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        failed:
          type: boolean
        assistance:
          $ref: "#/components/schemas/AssistanceWrite"
        media_ids:
          description: Ready images of the athlete's own to attach (a form check). The complete list; omit for none.
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Id"

    AssistanceType:
      type: string
      enum: [band, partner, machine, incline, counterweight, foot_support]

    AssistanceWrite:
      # Nullable here rather than as oneOf [ref, null] at the use site, which
      # swift-openapi-generator cannot express and silently drops (ADR 0010).
      type: [object, "null"]
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/AssistanceType"
        band_id:
          description: Required with `type = band`, forbidden otherwise.
          type: [string, "null"]
          format: uuid
        band_count:
          description: Number of bands; at least 1 with `type = band`.
          type: integer
          minimum: 0
          maximum: 10
        anchor:
          type: [string, "null"]
          enum: [overhead, under_foot, under_knee, hip, other, null]
        estimated_assist_kg:
          type: [number, "null"]
          minimum: 0
          maximum: 1000
        note:
          type: string
          maxLength: 500

    SetEntry:
      type: object
      required: [id, block_id, order_index, round_index, kind, is_planned, rest_after_planned_s, rest_after_actual_s, rpe, rir, planned_item_id, completed_at, notes, updated_at, elements]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        block_id:
          $ref: "#/components/schemas/Id"
        order_index:
          type: integer
        round_index:
          type: [integer, "null"]
        kind:
          $ref: "#/components/schemas/SetKind"
        is_planned:
          type: boolean
        rest_after_planned_s:
          type: [integer, "null"]
        rest_after_actual_s:
          type: [integer, "null"]
        rpe:
          type: [number, "null"]
        rir:
          type: [integer, "null"]
        planned_item_id:
          description: The plan item a set started from a planned session comes from.
          type: [string, "null"]
          format: uuid
        completed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        notes:
          type: string
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SetElement"

    SetElement:
      type: object
      required: [id, order_index, exercise_id, measure, reps, hold_seconds, distance_m, tempo, load_kg, is_eccentric_only, is_partial_rom, rom_note, form_quality, failed, assistance_class, assistance, media_ids]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        order_index:
          type: integer
        exercise_id:
          $ref: "#/components/schemas/Id"
        measure:
          $ref: "#/components/schemas/Measure"
        reps:
          type: [integer, "null"]
        hold_seconds:
          type: [number, "null"]
        distance_m:
          type: [number, "null"]
        tempo:
          type: [string, "null"]
        load_kg:
          type: number
        is_eccentric_only:
          type: boolean
        is_partial_rom:
          type: boolean
        rom_note:
          type: [string, "null"]
        form_quality:
          type: [integer, "null"]
        failed:
          type: boolean
        assistance_class:
          description: Derived by the server from `assistance` and `load_kg`.
          type: string
          enum: [unassisted, assisted, loaded]
        assistance:
          $ref: "#/components/schemas/Assistance"
        media_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    Assistance:
      # Nullable here rather than as oneOf [ref, null] at the use site, which
      # swift-openapi-generator cannot express and silently drops (ADR 0010).
      type: [object, "null"]
      required: [id, type, band_id, band_count, anchor, estimated_assist_kg, note]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/AssistanceType"
        band_id:
          type: [string, "null"]
          format: uuid
        band_count:
          type: integer
        anchor:
          type: [string, "null"]
        estimated_assist_kg:
          type: [number, "null"]
        note:
          type: string

    ReorderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        blocks:
          description: Every live block of the session, in the new order.
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Id"
        sets:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [block_id, set_ids]
            properties:
              block_id:
                $ref: "#/components/schemas/Id"
              set_ids:
                description: Every live set of the block, in the new order.
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/Id"

    LastSet:
      type: object
      required: [session_id, local_date, set]
      properties:
        session_id:
          $ref: "#/components/schemas/Id"
        local_date:
          type: string
          format: date
        set:
          $ref: "#/components/schemas/SetEntry"

    # --------------------------------------------------------------- skills
    Criteria:
      description: The unlock DSL (brief §6), with defaults made explicit. Empty means self-attest only.
      type: object
      properties:
        all:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        any:
          type: array
          items:
            $ref: "#/components/schemas/Condition"

    Condition:
      type: object
      required: [exercise, measure, op, value, assistance, occurrences]
      properties:
        exercise:
          $ref: "#/components/schemas/Slug"
        measure:
          type: string
          enum: [reps, hold_seconds, distance_m]
        op:
          type: string
          enum: [">=", ">"]
        value:
          type: number
        assistance:
          type: string
          enum: [none, any]
        min_load_kg:
          type: number
        max_load_kg:
          type: number
        min_form_quality:
          type: integer
        occurrences:
          type: integer
        within_days:
          type: integer

    MapPoint:
      # Nullable here rather than as oneOf [ref, null] at the use site, which
      # swift-openapi-generator cannot express and silently drops (ADR 0010).
      type: [object, "null"]
      required: [constellation, x, y]
      properties:
        constellation:
          type: string
        x:
          type: number
        y:
          type: number

    SkillLevel:
      type: object
      required: [id, slug, name, order, description, est_weeks_from_prev, unlock_criteria, exercises]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        order:
          type: integer
        description:
          type: string
        est_weeks_from_prev:
          description: A display hint shared by everyone; not a promise.
          type: [integer, "null"]
        unlock_criteria:
          $ref: "#/components/schemas/Criteria"
        exercises:
          type: array
          items:
            type: object
            required: [exercise_id, slug, role]
            properties:
              exercise_id:
                $ref: "#/components/schemas/Id"
              slug:
                $ref: "#/components/schemas/Slug"
              role:
                type: string
                enum: [primary_test, progression, accessory, prehab]

    Skill:
      type: object
      required: [id, slug, name, family, difficulty_tier, is_milestone, status, aka, summary, primary_muscles, common_faults, map, levels]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        family:
          $ref: "#/components/schemas/Slug"
        difficulty_tier:
          type: integer
          minimum: 1
          maximum: 10
        is_milestone:
          type: boolean
        status:
          description: "`draft_placeholder` marks content that is not yet researched."
          type: string
          enum: [active, draft_placeholder]
        aka:
          type: array
          items:
            type: string
        summary:
          type: string
        primary_muscles:
          type: array
          items:
            type: string
        common_faults:
          type: array
          items:
            type: string
        map:
          $ref: "#/components/schemas/MapPoint"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/SkillLevel"

    SkillEdge:
      type: object
      required: [from_level_id, to_level_id, relation, weight]
      properties:
        from_level_id:
          $ref: "#/components/schemas/Id"
        to_level_id:
          $ref: "#/components/schemas/Id"
        relation:
          type: string
          enum: [prerequisite, recommended, alternative, antagonist]
        weight:
          type: number

    SkillGraph:
      type: object
      required: [content_version, skills, edges]
      properties:
        content_version:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/SkillEdge"

    Disclaimer:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum: [educational_only]
        text:
          type: string

    Injury:
      type: object
      required: [region, name, description, risk_factors, early_signs, prehab_exercises, disclaimer]
      properties:
        region:
          type: string
        name:
          type: string
        description:
          type: string
        risk_factors:
          type: array
          items:
            type: string
        early_signs:
          type: array
          items:
            type: string
        prehab_exercises:
          type: array
          items:
            type: object
            required: [exercise_id, slug]
            properties:
              exercise_id:
                $ref: "#/components/schemas/Id"
              slug:
                $ref: "#/components/schemas/Slug"
        disclaimer:
          type: string
          enum: [educational_only]

    SkillDetail:
      allOf:
        - $ref: "#/components/schemas/Skill"
        - type: object
          required: [injuries, injury_disclaimer]
          properties:
            injuries:
              type: array
              items:
                $ref: "#/components/schemas/Injury"
            injury_disclaimer:
              $ref: "#/components/schemas/Disclaimer"

    LevelState:
      type: object
      required: [level_id, state, best_value, best_unit, best_at, first_achieved_at, verification, stale_since, attempts_count]
      properties:
        level_id:
          $ref: "#/components/schemas/Id"
        state:
          type: string
          enum: [locked, available, in_progress, unlocked]
        best_value:
          description: The best logged value for the level's headline condition. Current form, not achievement.
          type: [number, "null"]
        best_unit:
          type: [string, "null"]
          enum: [reps, hold_seconds, distance_m, null]
        best_at:
          $ref: "#/components/schemas/NullableTimestamp"
        first_achieved_at:
          $ref: "#/components/schemas/NullableTimestamp"
        verification:
          type: [string, "null"]
          enum: [auto, self_attested, coach, null]
        stale_since:
          description: A hint that an unlocked skill has not been practised for a while. It never changes `state`.
          $ref: "#/components/schemas/NullableTimestamp"
        attempts_count:
          type: integer

    SkillMap:
      type: object
      required: [content_version, skills, edges, states]
      properties:
        content_version:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/SkillEdge"
        states:
          description: One entry per level of every listed skill.
          type: array
          items:
            $ref: "#/components/schemas/LevelState"

    Unlock:
      type: object
      required: [level_id, skill_slug, skill_name, level_slug, level_name, verification, occurred_at, evidence_set_entry_id]
      properties:
        level_id:
          $ref: "#/components/schemas/Id"
        skill_slug:
          $ref: "#/components/schemas/Slug"
        skill_name:
          type: string
        level_slug:
          $ref: "#/components/schemas/Slug"
        level_name:
          type: string
        verification:
          type: string
          enum: [auto, self_attested, coach]
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        evidence_set_entry_id:
          type: [string, "null"]
          format: uuid

    XPAward:
      type: object
      required: [source, amount]
      properties:
        source:
          type: string
          enum: [session_completed, skill_unlocked, badge_earned, streak_milestone, plan_adherence, deload_completed]
        amount:
          type: integer

    Streak:
      type: object
      required: [current_days, longest_days, freeze_credits, last_counted_date]
      properties:
        current_days:
          description: Consecutive days trained, rested by plan, or bridged by a freeze.
          type: integer
        longest_days:
          type: integer
        freeze_credits:
          description: Earned automatically; each bridges one missed day.
          type: integer
        last_counted_date:
          type: [string, "null"]
          format: date

    SessionComplete:
      type: object
      additionalProperties: false
      properties:
        completed_at:
          description: When the athlete finished. Defaults to now.
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/Timestamp"
        perceived_fatigue:
          type: integer
          minimum: 1
          maximum: 10
        bodyweight_kg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    CompletionResult:
      type: object
      required: [session, already_completed, unlocked, newly_available, xp_awarded, xp_total, streak]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        already_completed:
          type: boolean
        unlocked:
          description: Levels this completion unlocked, in prerequisite order.
          type: array
          items:
            $ref: "#/components/schemas/Unlock"
        newly_available:
          description: Levels that became available because their prerequisites are now unlocked.
          type: array
          items:
            $ref: "#/components/schemas/Id"
        xp_awarded:
          type: array
          items:
            $ref: "#/components/schemas/XPAward"
        xp_total:
          type: integer
        streak:
          $ref: "#/components/schemas/Streak"
        plan_changes:
          description: |
            What the training planner changed after the completion (spec
            §10.2, ADR 0018). Absent when the planner did not run: without
            an onboarding, while it is unavailable, for a rest day, or when
            it failed; the next `GET /v1/me/plan` catches the session up.
            A repeated completion answers with the changes of the first.
          type: array
          items:
            $ref: "#/components/schemas/PlanChange"

    AttestRequest:
      description: |
        Empty for now (send `{}`); a body keeps room for fields such as a
        coach reference without a breaking change.
      type: object
      additionalProperties: false
      properties: {}

    AttestResult:
      type: object
      required: [unlock, newly_available]
      properties:
        unlock:
          $ref: "#/components/schemas/Unlock"
        newly_available:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    Progress:
      type: object
      required: [xp_total, streak]
      properties:
        xp_total:
          type: integer
        streak:
          $ref: "#/components/schemas/Streak"

    # ----------------------------------------------------------------- sync
    SyncSession:
      description: A session row as sync carries it, without its blocks.
      type: object
      required: [id, started_at, ended_at, timezone, local_date, title, notes, perceived_fatigue, bodyweight_kg, status, is_rest_day, template_id, planned_session_id, completed_at, updated_at, server_updated_at, server_seq, deleted_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          $ref: "#/components/schemas/TimeZone"
        local_date:
          type: string
          format: date
        title:
          type: string
        notes:
          type: string
        perceived_fatigue:
          type: [integer, "null"]
        bodyweight_kg:
          type: [number, "null"]
        status:
          $ref: "#/components/schemas/SessionStatus"
        is_rest_day:
          type: boolean
        template_id:
          type: [string, "null"]
          format: uuid
        planned_session_id:
          description: The planned session the session was started from.
          type: [string, "null"]
          format: uuid
        completed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        server_updated_at:
          $ref: "#/components/schemas/Timestamp"
        server_seq:
          type: integer
          format: int64
        deleted_at:
          $ref: "#/components/schemas/NullableTimestamp"

    SyncBlock:
      description: A block row as sync carries it, without its sets.
      type: object
      required: [id, session_id, order_index, kind, rounds_planned, rounds_done, interval_s, notes, updated_at, server_seq, deleted_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        session_id:
          $ref: "#/components/schemas/Id"
        order_index:
          type: integer
        kind:
          $ref: "#/components/schemas/BlockKind"
        rounds_planned:
          type: [integer, "null"]
        rounds_done:
          type: [integer, "null"]
        interval_s:
          type: [integer, "null"]
        notes:
          type: string
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        server_seq:
          type: integer
          format: int64
        deleted_at:
          $ref: "#/components/schemas/NullableTimestamp"

    SyncSet:
      description: |
        A set entry with its current, ordered elements. `server_seq` is the
        latest change to the set or any of its elements. A deleted set has no
        elements.
      type: object
      required: [id, session_id, block_id, order_index, round_index, kind, is_planned, rest_after_planned_s, rest_after_actual_s, rpe, rir, planned_item_id, completed_at, notes, updated_at, server_seq, deleted_at, elements]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        session_id:
          $ref: "#/components/schemas/Id"
        block_id:
          $ref: "#/components/schemas/Id"
        order_index:
          type: integer
        round_index:
          type: [integer, "null"]
        kind:
          $ref: "#/components/schemas/SetKind"
        is_planned:
          type: boolean
        rest_after_planned_s:
          type: [integer, "null"]
        rest_after_actual_s:
          type: [integer, "null"]
        rpe:
          type: [number, "null"]
        rir:
          type: [integer, "null"]
        planned_item_id:
          description: The plan item a set started from a planned session comes from.
          type: [string, "null"]
          format: uuid
        completed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        notes:
          type: string
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        server_seq:
          type: integer
          format: int64
        deleted_at:
          $ref: "#/components/schemas/NullableTimestamp"
        elements:
          type: array
          items:
            $ref: "#/components/schemas/SetElement"

    SyncBodyweight:
      type: object
      required: [id, measured_at, local_date, bodyweight_kg, note, updated_at, server_seq, deleted_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        measured_at:
          $ref: "#/components/schemas/Timestamp"
        local_date:
          type: string
          format: date
        bodyweight_kg:
          type: number
        note:
          type: string
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        server_seq:
          type: integer
          format: int64
        deleted_at:
          $ref: "#/components/schemas/NullableTimestamp"

    SyncPage:
      type: object
      required: [cursor, has_more, sessions, blocks, sets, bodyweight]
      properties:
        cursor:
          description: Send this as `cursor` next time.
          type: integer
          format: int64
        has_more:
          type: boolean
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SyncSession"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/SyncBlock"
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SyncSet"
        bodyweight:
          type: array
          items:
            $ref: "#/components/schemas/SyncBodyweight"

    SessionPut:
      description: |
        A session's full client-side state. Creates the session, or updates
        every field present. `status` may move a session between draft and
        abandoned; completion is the `complete` op.
      type: object
      additionalProperties: false
      required: [started_at, timezone]
      properties:
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          $ref: "#/components/schemas/TimeZone"
        title:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 10000
        perceived_fatigue:
          type: [integer, "null"]
          minimum: 1
          maximum: 10
        bodyweight_kg:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 500
        is_rest_day:
          type: boolean
        template_id:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum: [draft, abandoned]
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    BodyweightWrite:
      type: object
      additionalProperties: false
      required: [measured_at, timezone, bodyweight_kg]
      properties:
        measured_at:
          $ref: "#/components/schemas/Timestamp"
        timezone:
          description: Where the athlete was; it fixes `local_date`.
          $ref: "#/components/schemas/TimeZone"
        bodyweight_kg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        note:
          type: string
          maxLength: 500
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    SyncOp:
      description: |
        One write. `data` is validated against the schema for the op:

        | `entity` | `op` | `data` | `session_id` |
        |---|---|---|---|
        | `session` | `put` | `SessionPut` | — |
        | `session` | `complete` | `SessionComplete` | — |
        | `session` | `delete` | — | — |
        | `block` | `put` | `BlockWrite` | required |
        | `block` | `delete` | — | required |
        | `set` | `put` | `SetEntryWrite` | required |
        | `set` | `delete` | — | required |
        | `bodyweight` | `put` | `BodyweightWrite` | — |
        | `bodyweight` | `delete` | — | — |
      type: object
      additionalProperties: false
      required: [op, entity, id]
      properties:
        op:
          type: string
          enum: [put, delete, complete]
        entity:
          type: string
          enum: [session, block, set, bodyweight]
        id:
          $ref: "#/components/schemas/Id"
        session_id:
          $ref: "#/components/schemas/Id"
        data:
          anyOf:
            - $ref: "#/components/schemas/SessionPut"
            - $ref: "#/components/schemas/SessionComplete"
            - $ref: "#/components/schemas/BlockWrite"
            - $ref: "#/components/schemas/SetEntryWrite"
            - $ref: "#/components/schemas/BodyweightWrite"

    SyncPush:
      type: object
      additionalProperties: false
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SyncOp"

    SyncOpResult:
      type: object
      required: [index, status]
      properties:
        index:
          description: The op's position in `ops`.
          type: integer
        status:
          description: |
            `applied`; `superseded` — the server's copy wins (a deleted row,
            or a set older than the server's), so drop the op and take the
            server's copy at the next pull; `rejected` — the op is invalid
            (see `problem`) and will never apply as sent.
          type: string
          enum: [applied, superseded, rejected]
        problem:
          $ref: "#/components/schemas/Problem"
        completion:
          description: For a `complete` op that applied, what completing the session did.
          $ref: "#/components/schemas/CompletionResult"

    SyncPushResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncOpResult"

    # ---------------------------------------------------------------- media
    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [id, kind, mime, bytes]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [image]
        mime:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
        bytes:
          description: The exact size of the file to upload.
          type: integer
          format: int64
          minimum: 1
          maximum: 15728640
        width:
          type: integer
          minimum: 1
          maximum: 20000
        height:
          type: integer
          minimum: 1
          maximum: 20000

    Media:
      type: object
      required: [id, kind, mime, bytes, width, height, status, created_at, ready_at, url, url_expires_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [image, video]
        mime:
          type: string
        bytes:
          type: integer
          format: int64
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        status:
          type: string
          enum: [pending, ready, failed, quarantined]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        ready_at:
          $ref: "#/components/schemas/NullableTimestamp"
        url:
          description: A short-lived download URL, when the asset is ready.
          type: [string, "null"]
          format: uri
        url_expires_at:
          $ref: "#/components/schemas/NullableTimestamp"

    MediaUpload:
      type: object
      required: [media, upload]
      properties:
        media:
          $ref: "#/components/schemas/Media"
        upload:
          type: object
          required: [method, url, headers, expires_at]
          properties:
            method:
              type: string
              enum: [PUT]
            url:
              type: string
              format: uri
            headers:
              description: Send exactly these headers with the upload; they are part of the signature.
              type: object
              additionalProperties:
                type: string
            expires_at:
              $ref: "#/components/schemas/Timestamp"

    # ------------------------------------------------------------ planning
    RegionId:
      description: A body-map region, as `GET /v1/planner/catalogue` lists them.
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      maxLength: 40
      examples: [elbow_inner]
    CalendarDate:
      description: A calendar day.
      type: string
      format: date
    NullableCalendarDate:
      type: [string, "null"]
      format: date
    Equipment:
      type: string
      enum: [floor, wall, pull_up_bar, low_bar, parallel_bars, parallettes, rings, resistance_bands,
             weight_vest, dumbbells_or_plates, dip_belt, box_or_bench, gym, outdoor_park]
    IsoWeekday:
      description: ISO 8601 weekday, 1 = Monday … 7 = Sunday.
      type: integer
      minimum: 1
      maximum: 7
    TrainingLevel:
      type: string
      enum: [sedentary, recreational, trained, highly_trained]
    TrainingAge:
      type: string
      enum: [lt_6_months, 6_to_12_months, 1_to_4_years, gt_4_years]
    LastRegularTraining:
      type: string
      enum: [current_or_lt_3_weeks, 3_to_6_weeks, 7_to_16_weeks, 17_to_26_weeks, gt_26_weeks, never]
    DataConfidence:
      type: string
      enum: [estimated, counted_last_4_weeks, filmed]
    MobilityAnswer:
      type: string
      enum: ["yes", partly, "no"]
    MobilityChecks:
      description: Self-checks that steer the choice of exercises, never the level (onboarding.md §3.6).
      type: object
      additionalProperties: false
      properties:
        wrist:
          $ref: "#/components/schemas/MobilityAnswer"
        shoulder:
          $ref: "#/components/schemas/MobilityAnswer"
        ankle:
          $ref: "#/components/schemas/MobilityAnswer"
        compression:
          $ref: "#/components/schemas/MobilityAnswer"
    PainTimepoint:
      type: string
      enum: [before_session, warmup, during, after, next_morning, daily]
    Restriction:
      description: A movement category a professional restricted.
      type: string
      enum: [support_straight_arm, hang_pull, overhead, wrist_extension_loaded, supination_loaded, spine_extension]

    TrainingGoalWrite:
      type: object
      additionalProperties: false
      required: [skill, target_level, priority]
      properties:
        skill:
          $ref: "#/components/schemas/Slug"
        target_level:
          $ref: "#/components/schemas/Slug"
        priority:
          type: integer
          minimum: 1
          maximum: 3
        target_date:
          $ref: "#/components/schemas/CalendarDate"

    TrainingGoal:
      type: object
      required: [skill, target_level, priority, target_date]
      properties:
        skill:
          $ref: "#/components/schemas/Slug"
        target_level:
          $ref: "#/components/schemas/Slug"
        priority:
          type: integer
        target_date:
          $ref: "#/components/schemas/NullableCalendarDate"

    StageAnswer:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level:
          description: The level the athlete holds now, `none` or `unknown`.
          type: string
          maxLength: 80
        class:
          description: How long or how often, as a stage class of the skill, or `unknown`.
          type: string
          maxLength: 20

    BodyMapEntry:
      type: object
      additionalProperties: false
      required: [current, past_12_months]
      properties:
        current:
          type: boolean
        past_12_months:
          type: boolean

    Complaint:
      type: object
      additionalProperties: false
      required: [pain_daily, pain_training, onset, duration_weeks, suspected_serious, professional_assessment]
      properties:
        pain_daily:
          type: number
          minimum: 0
          maximum: 10
        pain_training:
          type: number
          minimum: 0
          maximum: 10
        onset:
          type: string
          enum: [sudden, gradual]
        duration_weeks:
          type: number
          minimum: 0
          maximum: 520
        suspected_serious:
          type: string
          enum: ["yes", "no", unsure]
        professional_assessment:
          type: string
          enum: ["no", yes_overuse_or_tendon, yes_tear_or_suspected_tear, yes_other, in_progress]
        restrictions:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            $ref: "#/components/schemas/Restriction"

    RedFlagAnswerMap:
      description: Red-flag ID → answered yes.
      type: object
      maxProperties: 20
      additionalProperties:
        type: boolean

    OnboardingAnswers:
      description: The onboarding in one request (docs/algorithm/onboarding.md §3).
      type: object
      additionalProperties: false
      required: [birth_year, health_data_consent, disclaimer_ack, goals, sessions_per_week, session_minutes, equipment,
                 bodyweight_kg, training_level, calisthenics_training_age, last_regular_training, classes,
                 data_confidence, exertion_symptoms, screening]
      properties:
        birth_year:
          type: integer
          minimum: 1920
          maximum: 2100
        health_data_consent:
          description: Consent to keep complaint and health answers. Without it the safety questions are still asked and applied, but not kept.
          type: boolean
        disclaimer_ack:
          description: The athlete read that the app adapts training and replaces no medical advice. Must be true.
          type: boolean
        goals:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/TrainingGoalWrite"
        sessions_per_week:
          type: integer
          minimum: 1
          maximum: 7
        session_minutes:
          description: 20, 30, 45, 60, 75 or 90.
          type: integer
          minimum: 20
          maximum: 90
        equipment:
          type: array
          uniqueItems: true
          maxItems: 14
          items:
            $ref: "#/components/schemas/Equipment"
        bodyweight_kg:
          type: number
          minimum: 30
          maximum: 250
        training_level:
          $ref: "#/components/schemas/TrainingLevel"
        calisthenics_training_age:
          $ref: "#/components/schemas/TrainingAge"
        last_regular_training:
          $ref: "#/components/schemas/LastRegularTraining"
        pre_break_level:
          description: Skill → the level held before the break.
          type: object
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/Slug"
        classes:
          description: Question key → answer class key or `unknown`, as the catalogue's `class_questions` list them.
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 20
        skill_stages:
          description: Goal skill → the stage the athlete holds now.
          type: object
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/StageAnswer"
        mobility_checks:
          $ref: "#/components/schemas/MobilityChecks"
        data_confidence:
          $ref: "#/components/schemas/DataConfidence"
        exertion_symptoms:
          description: Chest pain, unusual shortness of breath, dizziness or fainting under exertion (RF-10).
          type: boolean
        screening:
          description: The six further screening questions, in the order of onboarding.md §3.7.
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: boolean
        body_map:
          description: Region → current complaint and injury in the last 12 months.
          type: object
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/BodyMapEntry"
        complaints:
          description: Region → details, for every current region of the body map.
          type: object
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/Complaint"
        red_flags:
          description: Region → answers, for every current region of the body map.
          type: object
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/RedFlagAnswerMap"
        clarifications:
          description: Question id of an earlier `needs_answers` result → yes.
          type: object
          maxProperties: 10
          additionalProperties:
            type: boolean
        preferred_days:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            $ref: "#/components/schemas/IsoWeekday"

    OnboardingQuestion:
      type: object
      required: [id, rule, skill, text]
      properties:
        id:
          description: Send the answer back under this key in `clarifications`.
          type: string
        rule:
          type: string
        skill:
          type: [string, "null"]
        text:
          type: string

    OnboardingResult:
      type: object
      required: [status, questions, realism, hints, reasons, disclaimer]
      properties:
        status:
          type: string
          enum: [needs_answers, blocked, complete]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingQuestion"
        realism:
          type: array
          items:
            $ref: "#/components/schemas/GoalRealism"
        hints:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"
        disclaimer:
          type: string
        plan:
          description: The first plan; absent while questions are open.
          $ref: "#/components/schemas/TrainingPlan"

    TrainingProfile:
      type: object
      required: [birth_year, is_minor, sessions_per_week, session_minutes, equipment, bodyweight_kg, training_level,
                 training_months, last_regular_training, health_data_consent, disclaimer_ack, onboarded_at,
                 preferred_days, mobility_checks, max_added_load_kg, smallest_plate_kg]
      properties:
        birth_year:
          type: integer
        is_minor:
          description: Minors get no plan (SAFE-07).
          type: boolean
        sessions_per_week:
          type: integer
        session_minutes:
          type: integer
        equipment:
          description: What the athlete has, with what a gym or a park implies.
          type: array
          items:
            $ref: "#/components/schemas/Equipment"
        bodyweight_kg:
          type: number
        training_level:
          $ref: "#/components/schemas/TrainingLevel"
        training_months:
          description: A lower bound of the calisthenics training age, advanced by the log.
          type: number
        last_regular_training:
          $ref: "#/components/schemas/LastRegularTraining"
        health_data_consent:
          type: boolean
        disclaimer_ack:
          type: boolean
        onboarded_at:
          $ref: "#/components/schemas/CalendarDate"
        preferred_days:
          type: array
          items:
            $ref: "#/components/schemas/IsoWeekday"
        mobility_checks:
          $ref: "#/components/schemas/MobilityChecks"
        max_added_load_kg:
          description: Upper limit of added load; null means none.
          type: [number, "null"]
        smallest_plate_kg:
          description: The smallest plate; null means 1.25 kg (PAR-S-37).
          type: [number, "null"]

    TrainingProfileUpdate:
      type: object
      additionalProperties: false
      required: [sessions_per_week, session_minutes, equipment, bodyweight_kg]
      properties:
        sessions_per_week:
          type: integer
          minimum: 1
          maximum: 7
        session_minutes:
          description: 20, 30, 45, 60, 75 or 90.
          type: integer
          minimum: 20
          maximum: 90
        equipment:
          type: array
          uniqueItems: true
          maxItems: 14
          items:
            $ref: "#/components/schemas/Equipment"
        bodyweight_kg:
          type: number
          minimum: 30
          maximum: 250
        preferred_days:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            $ref: "#/components/schemas/IsoWeekday"
        mobility_checks:
          $ref: "#/components/schemas/MobilityChecks"
        max_added_load_kg:
          type: number
          minimum: 0
          maximum: 100
        smallest_plate_kg:
          type: number
          exclusiveMinimum: 0
          maximum: 25

    TrainingGoalsUpdate:
      type: object
      additionalProperties: false
      required: [goals]
      properties:
        goals:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/TrainingGoalWrite"

    TrainingGoalList:
      type: object
      required: [goals, realism]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/TrainingGoal"
        realism:
          description: The realism check of every dated goal (GOAL-05).
          type: array
          items:
            $ref: "#/components/schemas/GoalRealism"

    GoalRealism:
      description: |
        How long the step to a dated goal usually takes (GOAL-05). A band of
        weeks, never a promise; `unrealistic` when the date is before its
        lower end. A milestone is the next level on the way.
      type: object
      required: [skill, target_level, lower_weeks, shown_from_weeks, shown_to_weeks, weeks_to_date, unrealistic,
                 milestone, milestone_from_weeks, milestone_to_weeks, reason]
      properties:
        skill:
          $ref: "#/components/schemas/Slug"
        target_level:
          $ref: "#/components/schemas/Slug"
        lower_weeks:
          type: number
        shown_from_weeks:
          type: number
        shown_to_weeks:
          type: number
        weeks_to_date:
          type: number
        unrealistic:
          type: boolean
        milestone:
          type: [string, "null"]
        milestone_from_weeks:
          type: [number, "null"]
        milestone_to_weeks:
          type: [number, "null"]
        reason:
          $ref: "#/components/schemas/PlanReason"

    PlanReason:
      description: |
        Why the planner decided something: the rule, the parameters it used,
        their sources and the evidence level (spec §9.1). A reason tied to a
        region with a complaint or a red flag names the region and carries
        no sources, so no study title reads like a diagnosis (EXPL-07).
      type: object
      required: [rule_id, params, sources, evidence, text, args, region]
      properties:
        rule_id:
          type: string
        params:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
        evidence:
          type: string
        text:
          type: string
        args:
          type: object
          additionalProperties:
            type: string
        region:
          type: [string, "null"]

    TrainingPlan:
      description: One week of planned sessions (spec §5.10).
      type: object
      required: [id, week_start, ruleset_version, input_hash, stopped, deload, sessions, rest_days, exclusions, hints,
                 realism, monitor, loads, reasons, disclaimer]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        week_start:
          $ref: "#/components/schemas/CalendarDate"
        ruleset_version:
          type: string
        input_hash:
          description: SHA-256 of everything the plan depends on; the same inputs give the same plan.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        stopped:
          description: Training is stopped until a clearance (SAFE-02) or planned for adults only (SAFE-07).
          type: boolean
        deload:
          description: The kind of deload this week is, if it is one.
          type: [string, "null"]
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PlannedSession"
        rest_days:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDate"
        exclusions:
          description: Exercises left out, and why.
          type: array
          items:
            $ref: "#/components/schemas/PlanExclusion"
        hints:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"
        realism:
          type: array
          items:
            $ref: "#/components/schemas/GoalRealism"
        monitor:
          description: Regions under pain monitoring, with the red-flag questions to ask offline.
          type: array
          items:
            $ref: "#/components/schemas/RegionMonitor"
        loads:
          description: The week load of every account before and after the caps (spec §7.2).
          type: array
          items:
            $ref: "#/components/schemas/AccountLoad"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"
        disclaimer:
          type: string

    PlannedSession:
      type: object
      required: [id, status, workout_session_id, check_in_applied, index, date, kind, est_minutes, blocks, reasons]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        status:
          description: |
            planned, or started once the log has a session for it (completed
            follows with the completion). A new plan of the week keeps the
            start of the session on the same day.
          type: string
        workout_session_id:
          description: The log session it was started as.
          type: [string, "null"]
          format: uuid
        check_in_applied:
          description: |
            A tired check-in at the start made the session lighter (ADAPT-17).
            The session then shows what its draft holds: technique instead
            of the max blocks' holds, no offers.
          type: boolean
        index:
          type: integer
        date:
          $ref: "#/components/schemas/CalendarDate"
        kind:
          type: string
          enum: [full, light, deload]
        est_minutes:
          type: number
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PlanBlock"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"

    PlanBlock:
      type: object
      required: [role, minutes, paired, items, reasons]
      properties:
        role:
          type: string
          enum: [warmup, balance, skill_max, skill_volume, strength, end]
        minutes:
          description: Time of a general warm-up or balance practice.
          type: [number, "null"]
        paired:
          description: Items alternate as antagonist pairs.
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"

    PlanItem:
      description: Identical planned sets of one exercise.
      type: object
      required: [id, exercise, exercise_name, skill, stimulus, kind, sets, reps, hold_s, load_kg, assist, reserve, rest_s,
                 calibration, offer, stop_rules, intensity, role, monitor, reasons]
      properties:
        id:
          description: Named by the planned set entries in the log (`planned_item_id`).
          $ref: "#/components/schemas/Id"
        exercise:
          $ref: "#/components/schemas/Slug"
        exercise_name:
          type: string
        skill:
          type: [string, "null"]
        stimulus:
          description: skill, skill_reps, strength, conditioning, eccentric, balance, technique, prehab or accessory.
          type: string
        kind:
          type: string
          enum: [working, warmup]
        sets:
          type: integer
        reps:
          type: [integer, "null"]
        hold_s:
          type: [integer, "null"]
        load_kg:
          description: Added load.
          type: [number, "null"]
        assist:
          type: string
          enum: [none, band]
        reserve:
          description: Reps or seconds left in reserve at the end of each set.
          type: integer
        rest_s:
          type: integer
        calibration:
          description: The first working set calibrates the estimate.
          type: boolean
        offer:
          description: A probe or first attempt, done only on the athlete's active choice.
          type: boolean
        stop_rules:
          description: Rule IDs that end the item early (form, failed reps, a drop, pain).
          type: array
          items:
            type: string
        intensity:
          type: string
          enum: [light, moderate, hard]
        role:
          type: string
          enum: [goal, feeder, support]
        monitor:
          description: The item loads a region under pain monitoring; ask for pain after it.
          type: boolean
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"

    PlanExclusion:
      type: object
      required: [exercise, exercise_name, reason]
      properties:
        exercise:
          $ref: "#/components/schemas/Slug"
        exercise_name:
          type: string
        reason:
          $ref: "#/components/schemas/PlanReason"

    RegionMonitor:
      type: object
      required: [region, questions]
      properties:
        region:
          $ref: "#/components/schemas/RegionId"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/RedFlagQuestion"

    AccountLoad:
      type: object
      required: [account, target, planned, cap, rule]
      properties:
        account:
          type: string
        target:
          type: number
        planned:
          type: number
        cap:
          type: number
        rule:
          type: string

    PlannedSessionDetail:
      type: object
      required: [plan_id, week_start, ruleset_version, session, disclaimer]
      properties:
        plan_id:
          $ref: "#/components/schemas/Id"
        week_start:
          $ref: "#/components/schemas/CalendarDate"
        ruleset_version:
          type: string
        session:
          $ref: "#/components/schemas/PlannedSession"
        disclaimer:
          type: string

    PlanChange:
      description: |
        One change to the plan or the planner's state (spec §6.14), such as
        `capacity`, `rung_down`, `deload_scheduled`, `region_state`,
        `referral_suggested`, `ask_red_flags`, `training_stopped`,
        `consent_changed` or `session_adjusted`. On `ask_red_flags` ask the
        region's red-flag questions. On `session_adjusted` the started
        session `session_id` followed the new plan: its open planned sets
        changed, its performed sets did not; fetch it again.
      type: object
      required: [kind, skill, region, session_id, from, to, reasons]
      properties:
        kind:
          type: string
        skill:
          type: [string, "null"]
        region:
          type: [string, "null"]
        session_id:
          description: The log session a `session_adjusted` change adjusted.
          type: [string, "null"]
          format: uuid
        from:
          type: [string, "null"]
        to:
          type: [string, "null"]
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/PlanReason"

    PlanEventCreate:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          description: Client-generated; a repeat with the same id is answered from the first time.
          $ref: "#/components/schemas/Id"

    PlannedSessionStart:
      type: object
      additionalProperties: false
      required: [id, timezone]
      properties:
        id:
          description: The log session's id, a UUIDv7 made by the client.
          $ref: "#/components/schemas/Id"
        started_at:
          description: Now when absent.
          $ref: "#/components/schemas/Timestamp"
        timezone:
          $ref: "#/components/schemas/TimeZone"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        check_in:
          $ref: "#/components/schemas/CheckIn"

    CheckIn:
      description: |
        How the athlete starts the session (spec §6.12, ADAPT-17). Sleep of
        at most 6 hours or fatigue of at least 8 makes the session lighter:
        the max blocks become submaximal technique, strength stays. The
        answers are not stored; the planned session only records that the
        check-in made it lighter.
      type: object
      additionalProperties: false
      properties:
        sleep_hours:
          description: Hours slept in the last 24 hours.
          type: number
          minimum: 0
          maximum: 24
        fatigue:
          description: Fatigue on the scale of `perceived_fatigue`, 1 (fresh) to 10 (exhausted).
          type: integer
          minimum: 1
          maximum: 10

    HealthConsentChange:
      type: object
      additionalProperties: false
      required: [id, granted]
      properties:
        id:
          description: Client-generated; a repeat with the same id is answered from the first time.
          $ref: "#/components/schemas/Id"
        granted:
          type: boolean
        screening:
          description: With a grant, the six screening questions again, in the order of onboarding.md §3.7.
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: boolean
        past_injuries:
          description: With a grant, the regions injured in the last 12 months.
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            $ref: "#/components/schemas/RegionId"

    PlanEventResult:
      type: object
      required: [changes, replayed]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PlanChange"
        replayed:
          description: The event was applied before; the changes are the ones recorded then.
          type: boolean

    PlanDecision:
      type: object
      required: [id, trigger, source_id, occurred_at, changes]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        trigger:
          description: onboarding, session_completed, pain_report, red_flags, clearance, symptoms, week_start or consent.
          type: string
        source_id:
          type: string
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PlanChange"

    PlanDecisionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanDecision"
        next_cursor:
          type: [string, "null"]

    PainReportCreate:
      type: object
      additionalProperties: false
      required: [id, region, timepoint, nrs, at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        region:
          $ref: "#/components/schemas/RegionId"
        timepoint:
          $ref: "#/components/schemas/PainTimepoint"
        nrs:
          description: Pain on the 0–10 numeric rating scale.
          type: number
          minimum: 0
          maximum: 10
        at:
          $ref: "#/components/schemas/Timestamp"
        lasted_over_1h:
          type: boolean
        persisted_over_15min:
          type: boolean
        sudden_sharp:
          type: boolean
        session_id:
          $ref: "#/components/schemas/Id"

    PainReport:
      type: object
      required: [id, region, timepoint, nrs, at, lasted_over_1h, persisted_over_15min, sudden_sharp, session_id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        region:
          $ref: "#/components/schemas/RegionId"
        timepoint:
          $ref: "#/components/schemas/PainTimepoint"
        nrs:
          type: number
        at:
          $ref: "#/components/schemas/Timestamp"
        lasted_over_1h:
          type: boolean
        persisted_over_15min:
          type: boolean
        sudden_sharp:
          type: boolean
        session_id:
          type: [string, "null"]
          format: uuid

    PainReportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PainReport"
        next_cursor:
          type: [string, "null"]

    RedFlagAnswers:
      type: object
      additionalProperties: false
      required: [id, answers]
      properties:
        id:
          description: Client-generated; a repeat with the same id is answered from the first time.
          $ref: "#/components/schemas/Id"
        answers:
          $ref: "#/components/schemas/RedFlagAnswerMap"

    RedFlagQuestion:
      description: |
        A warning-sign question. Urgency N: see a doctor now; D: in the next
        days; A: an assessment is advisable. The action says what a yes does
        to the plan. Minor-only questions are asked of minors only.
      type: object
      required: [id, urgency, action, question, advice, minor_only, followup]
      properties:
        id:
          type: string
        urgency:
          type: string
          enum: ["N", "D", "A"]
        action:
          type: string
          enum: [stop, lock, rtt0]
        question:
          type: string
        advice:
          type: string
        minor_only:
          type: boolean
        followup:
          $ref: "#/components/schemas/RedFlagFollowup"

    RedFlagFollowup:
      description: Asked after a yes; a yes to it raises the urgency.
      # Nullable here rather than as oneOf [ref, null] at the use site, which
      # swift-openapi-generator cannot express and silently drops (ADR 0010).
      type: [object, "null"]
      required: [id, urgency, action, question, advice]
      properties:
        id:
          type: string
        urgency:
          type: string
          enum: ["N", "D", "A"]
        action:
          type: string
          enum: [stop, lock, rtt0]
        question:
          type: string
        advice:
          type: string

    RegionStatus:
      type: object
      required: [region, name, tracked, state, entered_via, since, start_fraction, complaint, prior_injury,
                 restrictions, referral, rest_until, constraints, red_flags]
      properties:
        region:
          $ref: "#/components/schemas/RegionId"
        name:
          description: The region in the words of the body map.
          type: string
        tracked:
          description: The planner keeps a state for the region; false without consent to health data.
          type: boolean
        state:
          description: normal, locked, or a stage of the return ramp from rtt_0 (no load) to rtt_5.
          type: [string, "null"]
        entered_via:
          type: [string, "null"]
        since:
          $ref: "#/components/schemas/NullableCalendarDate"
        start_fraction:
          description: The share of the reference load the ramp started at.
          type: [number, "null"]
        complaint:
          type: boolean
        prior_injury:
          type: boolean
        restrictions:
          type: array
          items:
            type: string
        referral:
          description: soft or advise when an assessment is recommended.
          type: [string, "null"]
        rest_until:
          $ref: "#/components/schemas/NullableCalendarDate"
        constraints:
          description: region_locked, region_excluded or plan_stopped, when one names the region.
          type: array
          items:
            type: string
        red_flags:
          type: array
          items:
            $ref: "#/components/schemas/RedFlagQuestion"

    RegionOverview:
      type: object
      required: [regions, disclaimer]
      properties:
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionStatus"
        disclaimer:
          type: string

    Capacity:
      type: object
      required: [exercise, exercise_name, measure, assist, mu, sigma, confidence, origin, estimated_at, observations]
      properties:
        exercise:
          $ref: "#/components/schemas/Slug"
        exercise_name:
          type: string
        measure:
          type: string
          enum: [reps, hold_seconds]
        assist:
          type: string
          enum: [none, band]
        mu:
          description: Mean of the maximal reps or hold seconds.
          type: number
        sigma:
          description: Spread of the estimate.
          type: number
        confidence:
          type: string
          enum: [low, medium, high]
        origin:
          description: self_report, test, log or derived.
          type: string
        estimated_at:
          $ref: "#/components/schemas/Timestamp"
        observations:
          type: integer

    CapacityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Capacity"

    PlannerRule:
      type: object
      required: [id, title, text, params, sources, evidence]
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
        params:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
        evidence:
          type: string

    PlannerRuleList:
      type: object
      required: [ruleset_version, items]
      properties:
        ruleset_version:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlannerRule"

    PlannerSource:
      type: object
      required: [id, title, authors, year, url, type, evidence]
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: [string, "null"]
        year:
          type: [string, "null"]
        url:
          type: [string, "null"]
        type:
          type: [string, "null"]
        evidence:
          description: A strong study base, B single studies, C coaching literature, D practice reports.
          type: string

    PlannerSourceList:
      type: object
      required: [ruleset_version, items]
      properties:
        ruleset_version:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlannerSource"

    PlannerParameter:
      type: object
      required: [id, key, text, value, values, unit, sources, evidence, heuristic, definition, rationale]
      properties:
        id:
          type: string
        key:
          type: string
        text:
          description: The value as the research states it.
          type: [string, "null"]
        value:
          type: [number, "null"]
        values:
          description: Values by case, when the parameter has several.
          type: [object, "null"]
          additionalProperties:
            type: number
        unit:
          type: [string, "null"]
        sources:
          type: array
          items:
            type: string
        evidence:
          type: string
        heuristic:
          description: A rule of thumb of this app, to be sharpened with data.
          type: boolean
        definition:
          description: A scale reference or a mechanical identity; it needs a rationale, not a source.
          type: boolean
        rationale:
          type: [string, "null"]

    PlannerParameterList:
      type: object
      required: [ruleset_version, items]
      properties:
        ruleset_version:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlannerParameter"

    AnswerClass:
      type: object
      required: [key, lo, hi, open]
      properties:
        key:
          type: string
        lo:
          type: number
        hi:
          type: [number, "null"]
        open:
          description: More than `lo`, without an upper bound.
          type: boolean

    ClassQuestion:
      type: object
      required: [key, exercise, classes]
      properties:
        key:
          type: string
        exercise:
          $ref: "#/components/schemas/Slug"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/AnswerClass"

    PlannerLevel:
      type: object
      required: [slug, exercise, threshold, milestone]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        exercise:
          $ref: "#/components/schemas/Slug"
        threshold:
          description: The reps or seconds of the exercise at which the level counts as met.
          type: number
        milestone:
          type: boolean

    PlannerSkill:
      type: object
      required: [slug, name, foundation, levels, stage_classes]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        foundation:
          type: boolean
        levels:
          description: Easiest first.
          type: array
          items:
            $ref: "#/components/schemas/PlannerLevel"
        stage_classes:
          description: The answer classes of the skill's stage question; empty when it has none.
          type: array
          items:
            $ref: "#/components/schemas/AnswerClass"

    PlannerExercise:
      type: object
      required: [slug, name, measure, requires, skill, draft]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        measure:
          type: string
          enum: [reps, hold_seconds]
        requires:
          type: array
          items:
            $ref: "#/components/schemas/Equipment"
        skill:
          type: [string, "null"]
        draft:
          description: Draft content awaiting review.
          type: boolean

    PlannerRegion:
      type: object
      required: [id, name, red_flags]
      properties:
        id:
          $ref: "#/components/schemas/RegionId"
        name:
          type: string
        red_flags:
          description: The questions asked for the region, including those for minors only.
          type: array
          items:
            $ref: "#/components/schemas/RedFlagQuestion"

    PlannerCatalogue:
      type: object
      required: [ruleset_version, disclaimer, skills, exercises, regions, class_questions]
      properties:
        ruleset_version:
          type: string
        disclaimer:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/PlannerSkill"
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PlannerExercise"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/PlannerRegion"
        class_questions:
          type: array
          items:
            $ref: "#/components/schemas/ClassQuestion"
