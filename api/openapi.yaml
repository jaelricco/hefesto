      operationId: confirmScreeningClearance
      summary: Confirm a professional's clearance for training as a whole
      description: |
        The athlete confirms that a professional cleared them to train: the
        screening, a stop after exertion symptoms and every locked region.
        Idempotent by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
