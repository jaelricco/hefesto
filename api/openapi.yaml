  /v1/me/plan/sessions/{plannedSessionId}/start:
    parameters:
      - $ref: "#/components/parameters/PlannedSessionId"
    post:
      tags: [planning]
      operationId: startPlannedSession
      summary: Start a planned session in the training log
      description: |
        Writes the planned session into the log as a draft session (spec
        §10.2): its blocks in order, one planned set entry per planned set
        (`is_planned: true`) with one element carrying the targets. Each set
        entry names its plan item in `planned_item_id`; the session names the
        planned session in `planned_session_id`. Offers (probes, first
        attempts) are not written; the athlete adds them on active choice.
        A band target stays in the plan item: the log's assistance needs the
        band, which the athlete names when logging the set.

        Performing a set goes through the log API or sync as usual. A planned
        session starts once: a second start answers `200` with the session
        started first, whatever its `id`. After the log session is deleted,
        the planned session can start again. Nothing starts while training
        is stopped (`training-stopped`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedSessionStart"
      responses:
        "201":
          description: Started.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "200":
          description: Started before; the session it started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
