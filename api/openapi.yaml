      operationId: createUpload
      summary: Reserve a media asset and get a presigned upload URL
      description: |
        Creates a `pending` asset and returns a short-lived presigned `PUT`
        URL. Upload the bytes directly to object storage with exactly the
        returned headers, then call `POST /v1/media/{mediaId}/complete`.
        Images only for now (ADR 0002 §4); the schema is ready for video.
        Repeating the call for a pending asset returns a fresh URL.
      requestBody:
        required: true
