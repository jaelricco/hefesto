  # ------------------------------------------------------------------ sync

  /v1/sync:
    get:
      tags: [sync]
      operationId: pullChanges
      summary: Everything that changed since a cursor
      description: |
        Returns every row of the athlete's that changed after `cursor`, deletions
        included (a deleted row carries `deleted_at`), and the cursor to send
        next. Start from `0`; repeat while `has_more` is true.

        The cursor is a per-user total order over writes (`server_seq`), so a
        page is never missing a change that committed before a later one.
        A row appears at its latest change, with its current state; a set comes
        whole, with its current elements. Parents are included whenever a page
        holds a row whose parent the client has not seen yet, so a page can be
        applied on its own in the order sessions, blocks, sets. A row can
        therefore appear in more than one page; applying it again is harmless.

        The request also records `cursor` as acknowledged by this device.
      parameters:
        - name: cursor
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: A page of changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [sync]
      operationId: pushChanges
      summary: Apply a batch of offline writes
      description: |
        Applies `ops` in order. Each op runs the same code path as its REST
        endpoint (a set is always written whole, with its ordered elements),
        in its own transaction, and gets its own result: one bad op does not
        hold back the rest of the queue.

        Conflicts (ADR 0009): the last write the server receives wins, except
        for sets, where the athlete's own clock decides — a set whose
        `updated_at` is older than the server's copy is not applied
        (`superseded`). Deletions are final: a write to a deleted row is
        `superseded`.

        `Idempotency-Key` is required. Repeating a request with the same key
        and body returns the first response (`Idempotent-Replayed: true`);
        the same key with a different body is `422 idempotency-key-reuse`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPush"
      responses:
        "200":
          description: One result per op, in order.
          headers:
            Idempotent-Replayed:
              description: Present, and `true`, when this is a stored response to a repeated request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

