  # -------------------------------------------------------------- planning

  /v1/me/onboarding:
    post:
      tags: [planning]
      operationId: submitOnboarding
      summary: Answer the onboarding and get the first plan
      description: |
        All answers at once (docs/algorithm/onboarding.md §3). The result is
        one of:

        - `needs_answers`: at most two clarification questions. Nothing is
          stored; send the answers again with `clarifications`.
        - `blocked`: a safety answer stops training (SAFE-02). The profile
          is stored and the plan says why; a confirmed clearance ends it.
        - `complete`: the start state is stored; the result carries the
          realism of dated goals, hints and the first week's plan.

        A current complaint needs its details and an answer to every
        red-flag question asked for its region (see `GET
        /v1/planner/catalogue`). The onboarding runs once
        (`already-onboarded`); later changes go through the training profile
        and the goals. With an `Idempotency-Key` a retry returns the first
        response.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingAnswers"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
