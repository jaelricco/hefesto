name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/store/dbgen/' || true)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: sqlc output is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          sqlc generate
          test -z "$(git status --porcelain -- internal/store/dbgen)" || (git status --short -- internal/store/dbgen; echo "run make sqlc and commit the result"; exit 1)
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --timeout=5m

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -short -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # testcontainers starts Postgres on the runner's Docker. MinIO no longer
      # publishes images, so with-minio.sh builds the pinned official source
      # and runs it beside the tests.
      - run: ./scripts/with-minio.sh go test -race -tags=integration -count=1 ./...

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hefesto
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hefesto
        options: >-
          --health-cmd "pg_isready -U hefesto"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - name: up, down one, up again
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://hefesto:ci@localhost:5432/hefesto?sslmode=disable
          GOOSE_MIGRATION_DIR: db/migrations
        run: |
          shopt -s nullglob
          files=(db/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then echo "no migrations yet — skipping"; exit 0; fi
          goose up
          goose down
          goose up
          goose status

  content:
    name: content validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run ./cmd/contentlint -dir ./content -strict

  openapi:
    name: openapi lint + breaking-change diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: lint spec
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml
      - name: breaking-change diff against base
        if: github.event_name == 'pull_request'
        env:
          # Pinned and checksum-verified. @useoptic/openapi-cli, used before,
          # is unmaintained and every published version fails to start.
          OASDIFF_VERSION: 1.32.1
          OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
        run: |
          git show "origin/${GITHUB_BASE_REF}:api/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null || exit 0
          curl -fsSL -o /tmp/oasdiff.tgz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tgz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tgz -C /tmp oasdiff
          # api/oasdiff-ignore.txt lists findings that are not breaking, each with why.
          /tmp/oasdiff breaking /tmp/base-openapi.yaml api/openapi.yaml --fail-on ERR \
            --err-ignore api/oasdiff-ignore.txt

  scripts:
    name: shell scripts and workflows lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        # SC1091: bootstrap sources /etc/os-release, which exists on the target
        # host and not on the runner.
        run: shellcheck -e SC1091 scripts/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: production compose is valid
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=placeholder/' .env.prod.example > /tmp/check.env
          echo 'HEFESTO_TAG=v0.0.0-ci' >> /tmp/check.env
          docker compose -f docker-compose.prod.yml --env-file /tmp/check.env config --quiet

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
      # Development object storage, built from MinIO's source for `make up`.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.minio
          push: false
