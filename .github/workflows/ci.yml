name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/store/dbgen/' || true)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -short -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # testcontainers starts its own Postgres; the runner's Docker is enough.
      - run: go test -race -tags=integration -count=1 ./...

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lodestar
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lodestar
        options: >-
          --health-cmd "pg_isready -U lodestar"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - name: up, down one, up again
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://lodestar:ci@localhost:5432/lodestar?sslmode=disable
          GOOSE_MIGRATION_DIR: db/migrations
        run: |
          shopt -s nullglob
          files=(db/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then echo "no migrations yet — skipping"; exit 0; fi
          goose up
          goose down
          goose up
          goose status

  content:
    name: content validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run ./cmd/contentlint -dir ./content -strict

  openapi:
    name: openapi lint + breaking-change diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: lint spec
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml
      - name: breaking-change diff against base
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:api/openapi.yaml > /tmp/base-openapi.yaml 2>/dev/null || exit 0
          npx --yes @useoptic/openapi-cli@latest diff /tmp/base-openapi.yaml api/openapi.yaml --check

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
