name: deploy-staging

# Deploys every green commit on main to staging (ADR 0023): the same image as
# production, on the same host, as its own Compose project
# (docker-compose.staging.yml). Internal TestFlight builds talk to it.
#
# Off until the server exists: set the repository variable STAGING_DEPLOY to
# "true" (Settings → Secrets and variables → Actions → Variables) once
# /srv/hefesto/.env.staging is in place. It uses the same deploy secrets as
# production. Until then the job is skipped, not failed.
#
#   gh workflow run deploy-staging.yml -f ref=<branch-or-sha>   # by hand

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy to staging"
        required: true
        default: main
        type: string

# One staging deploy at a time, and never cancelled halfway through a
# migration; a newer commit waits for the running one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    if: >-
      vars.STAGING_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: image tag
        id: tag
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ steps.tag.outputs.sha }}

  deploy:
    name: deploy to staging
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: staging
      url: https://${{ vars.STAGING_API_DOMAIN || 'api-staging.hefesto.fit' }}/healthz
    env:
      STAGING_API_DOMAIN: ${{ vars.STAGING_API_DOMAIN || 'api-staging.hefesto.fit' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: set up ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The same files production ships; .env.staging lives only on the server.
      - name: sync deploy files
        run: |
          rsync -az \
            -e "ssh -p ${DEPLOY_PORT:-22} -i ~/.ssh/id_ed25519" \
            --include='docker-compose.prod.yml' --include='docker-compose.staging.yml' \
            --include='docker/' --include='docker/Caddyfile' \
            --include='scripts/' --include='scripts/*.sh' \
            --exclude='*' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/hefesto/"

      - name: deploy
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -p "${DEPLOY_PORT:-22}" -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
             docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             cd /srv/hefesto
             chmod +x scripts/*.sh
             DEPLOY_ENV=staging HEFESTO_IMAGE='$IMAGE' ./scripts/deploy.sh '$TAG'"

      - name: public smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://${STAGING_API_DOMAIN}/healthz" | grep -q '"status":"ok"'; then
              echo "staging is healthy"
              exit 0
            fi
            echo "attempt $i failed, retrying"
            sleep 5
          done
          echo "::error::staging never returned healthy after deploy"
          exit 1

      - name: summary
        if: always()
        run: |
          {
            echo "### Staging deploy ${{ needs.build.outputs.tag }}"
            echo ""
            echo "- commit: \`${{ needs.build.outputs.sha }}\`"
            echo "- url: https://${STAGING_API_DOMAIN}"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
