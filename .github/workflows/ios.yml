name: ios

# The iOS app (ADR 0010), built and tested on the self-hosted Mac runner.
# Runs only when the app, the API spec it is generated from, or this file
# changes. The runner is the owner's machine, so the job changes nothing
# outside its workspace: it uses whatever Xcode `xcode-select` points to, and
# keeps build products under ios/.derived and the package's .build.
on:
  pull_request:
    paths: ["ios/**", "api/openapi.yaml", ".github/workflows/ios.yml"]
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", "api/openapi.yaml", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      ui_tests:
        description: >-
          Also run the accessibility audit UI tests. They boot an iOS
          Simulator, which writes simulator state outside the workspace.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: HefestoKit tests and app build (self-hosted Mac)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep ios/.derived and the package's .build between runs (both are
          # git-ignored): a cold build resolves and compiles every dependency.
          clean: false

      - name: toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes available | grep -i ios || echo "no iOS simulator runtime installed"
          if ! command -v xcodegen >/dev/null; then
            echo "installing XcodeGen with Homebrew"
            brew install xcodegen
          fi
          xcodegen --version

      - name: swift test (HefestoKit)
        working-directory: ios/Packages/HefestoKit
        run: swift test --parallel

      - name: generate the project
        working-directory: ios
        run: xcodegen generate

      - name: build the app and its UI tests for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Hefesto.xcodeproj -scheme Hefesto \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E 'error:|BUILD SUCCEEDED|BUILD FAILED' || true
          if ! grep -q 'BUILD SUCCEEDED \*\*' build.log; then
            # Linker errors name their symbols on the lines around "error:".
            grep -B2 -A12 -E 'error:|Undefined symbols' build.log | tail -150
            exit 1
          fi

      # Only on request: the audit needs a booted simulator (see the input).
      - name: accessibility audit (UI tests)
        if: ${{ inputs.ui_tests }}
        working-directory: ios
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          phones = [d for d in devices if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"] if phones else "")')
          test -n "$device" || { echo "no iPhone simulator is installed"; exit 1; }
          xcodebuild test-without-building \
            -project Hefesto.xcodeproj -scheme Hefesto \
            -destination "id=$device" \
            -derivedDataPath .derived \
            -resultBundlePath ".derived/a11y-$GITHUB_RUN_ID.xcresult" 2>&1 | tee test.log | grep -E 'error:|Test Case|\*\* TEST' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' test.log
