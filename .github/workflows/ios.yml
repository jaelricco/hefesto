name: ios

# The iOS app (ADR 0010), built and tested on the self-hosted Mac runner.
# Runs only when the app, the API spec it is generated from, or this file
# changes. The runner is the owner's machine, so the job changes nothing
# outside its workspace: it uses whatever Xcode `xcode-select` points to, and
# keeps build products under ios/.derived and the package's .build.
on:
  pull_request:
    paths: ["ios/**", "api/openapi.yaml", ".github/workflows/ios.yml"]
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", "api/openapi.yaml", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      ui_tests:
        description: >-
          Also run the accessibility audit UI tests, on the simulator the
          screenshot job keeps ("Hefesto Screenshots").
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: HefestoKit tests and app build (self-hosted Mac)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep ios/.derived and the package's .build between runs (both are
          # git-ignored): a cold build resolves and compiles every dependency.
          clean: false

      - name: toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes available | grep -i ios || echo "no iOS simulator runtime installed"
          if ! command -v xcodegen >/dev/null; then
            echo "installing XcodeGen with Homebrew"
            brew install xcodegen
          fi
          xcodegen --version

      # Long builds run under caffeinate -i (no idle sleep while the command
      # runs) and at lower priority, so the runner keeps reaching GitHub.
      # Earlier runs died 10 minutes into a cold build with "lost
      # communication". Both last only as long as the command.
      - name: swift test (HefestoKit)
        working-directory: ios/Packages/HefestoKit
        run: caffeinate -i nice -n 10 swift test --parallel

      - name: generate the project
        working-directory: ios
        run: xcodegen generate

      - name: build the app and its UI tests for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          caffeinate -i nice -n 10 xcodebuild build-for-testing \
            -project Hefesto.xcodeproj -scheme Hefesto \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E 'error:|BUILD SUCCEEDED|BUILD FAILED' || true
          if ! grep -q 'BUILD SUCCEEDED \*\*' build.log; then
            # Linker errors name their symbols on the lines around "error:".
            grep -B2 -A12 -E 'error:|Undefined symbols' build.log | tail -150
            exit 1
          fi

      # What TestFlight archives: a release-type build (no DEBUG code, the
      # optimizer on). Staging differs from Release only in the API address.
      - name: build the Staging configuration for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          caffeinate -i nice -n 10 xcodebuild build \
            -project Hefesto.xcodeproj -scheme Hefesto -configuration Staging \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee staging-build.log | grep -E 'error:|BUILD SUCCEEDED|BUILD FAILED' || true
          if ! grep -q 'BUILD SUCCEEDED \*\*' staging-build.log; then
            grep -B2 -A12 -E 'error:|Undefined symbols' staging-build.log | tail -150
            exit 1
          fi

      # Only on request: the audit needs a booted simulator (see the input).
      - name: accessibility audit (UI tests)
        if: ${{ inputs.ui_tests }}
        working-directory: ios
        run: |
          set -o pipefail
          # The simulator the screenshot job keeps ("Hefesto Screenshots",
          # scripts/ios-screenshots.sh); this job creates no other.
          device=$(xcrun simctl list devices available | grep -F "    Hefesto Screenshots (" | head -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' || true)
          test -n "$device" || { echo "run the ios-screenshots workflow once first; it creates the simulator"; exit 1; }
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          caffeinate -i nice -n 10 xcodebuild test-without-building \
            -project Hefesto.xcodeproj -scheme Hefesto \
            -destination "id=$device" \
            -derivedDataPath .derived \
            -resultBundlePath ".derived/a11y-$GITHUB_RUN_ID.xcresult" 2>&1 | tee test.log | grep -E 'error:|Test Case|\*\* TEST' || true
          if ! grep -q '\*\* TEST SUCCEEDED \*\*' test.log; then
            # Each finding also becomes an annotation, readable from the API
            # without the log. GitHub keeps ten error annotations per step,
            # so there is one per test, listing its findings.
            grep -E ': error: ' test.log | sed -E 's/^[^:]*:[0-9]+: error: //' | sort -u > findings.txt || true
            echo "$(wc -l < findings.txt) findings"
            for t in testEveryScreen testEveryScreenAtTheLargestTextSize testEveryScreenInGerman; do
              body=$(grep -F " $t]" findings.txt | sed -E 's/^-\[[^]]*\] : //; s/%/%25/g' | head -80 \
                | awk '{ printf "%s%%0A", $0 }')
              if [ -n "$body" ]; then echo "::error title=Accessibility audit: $t::$body"; fi
            done
            exit 1
          fi
