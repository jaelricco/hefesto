# Exercises the planner can place (spec §2.2). In phase 5 the planner keeps
# its own list; merging it into content/exercises/*.yaml as a `training:`
# block comes with the content import (the existing tree is placeholder
# content, and new exercises there would be orphans until skills use them).
#
# og_ordinal: OG level from research 02 §3 (PAR-A-25 … PAR-A-37); 0 = below
# OG level 1 (research 02 §3.4). Where the source gives a range the lower
# bound is used and the note says so.
# torque_ratio: moment relative to the full stage (PAR-C-03 … PAR-C-08).
# bw_fraction: share of body weight moved (PAR-C-18 … PAR-C-22). Without a
# value the load scale is 1.0 (spec §4.5), the conservative side.
# All entries are draft content until a human review (ENT-10).
