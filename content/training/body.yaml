red_flags:
- id: RF-01
  regions: ['*']
  urgency: D
  action: lock
  question: Gab es einen plötzlichen Knall, Ruck oder stechenden Schmerz mit sofortigem Kraftverlust oder
    sichtbarer Formveränderung, zum Beispiel ein verschobener Muskelbauch am Oberarm oder an der Brust?
  advice: Lass das in den nächsten Tagen ärztlich abklären. Bis du eine Freigabe bestätigst, plant die
    App für diese Region keine Belastung.
  sources: [D-70, D-73, D-90]
- id: RF-02
  regions: ['*']
  urgency: D
  action: lock
  question: Hast du Taubheit, Kribbeln, ausstrahlenden Schmerz oder Schwäche in Arm, Hand oder Bein?
  advice: Lass das in den nächsten Tagen abklären. Bis du eine Freigabe bestätigst, plant die App für
    diese Region keine Belastung.
  sources: [D-88]
- id: RF-03
  regions: ['*']
  urgency: D
  action: lock
  question: Hast du deutlich Kraft verloren, oder kannst du das Gelenk nicht normal bewegen oder belasten?
  advice: Lass das in den nächsten Tagen abklären. Bis du eine Freigabe bestätigst, plant die App für
    diese Region keine Belastung.
  sources: [D-73, D-70]
- id: RF-04
  regions: ['*']
  urgency: A
  action: rtt0
  question: Hast du Schmerzen in Ruhe oder nachts, unabhängig von der Position?
  advice: Eine Abklärung bei einer Fachperson ist sinnvoll. Bis dahin plant die App für diese Region nur
    Übungen mit geringer Last.
  sources: [D-86, D-73]
- id: RF-05
  regions: ['*']
  urgency: D
  action: lock
  question: Hast du eine deutliche Schwellung, einen grossen Bluterguss oder eine Formveränderung an einem
    Gelenk?
  advice: Lass das in den nächsten Tagen abklären. Wirkt ein Gelenk sichtbar verschoben oder ausgerenkt,
    such sofort ärztliche Hilfe. Bis du eine Freigabe bestätigst, plant die App für diese Region keine
    Belastung.
  sources: [D-73, D-70, D-90]
- id: RF-06
  regions: ['*']
  urgency: D
  action: lock
  question: Gab es vor Beginn der Schmerzen einen Sturz, einen Aufprall oder einen anderen Unfall?
  advice: Lass das in den nächsten Tagen abklären. Bis du eine Freigabe bestätigst, plant die App für
    diese Region keine Belastung.
  sources: [D-73, D-86, D-87]
- id: RF-07
  regions: ['*']
  urgency: N
  action: stop
  question: Hast du Fieber, ist ein Gelenk gerötet oder überwärmt, oder fühlst du dich allgemein krank?
  advice: Bitte lass das sofort ärztlich abklären. Die App plant kein Training, bis du eine Freigabe bestätigst.
  sources: [D-73, D-86]
- id: RF-08
  regions: [lower_back]
  urgency: N
  action: stop
  question: Hast du zusammen mit den Rückenschmerzen Probleme mit Blase oder Darm, Taubheit im Gesäss-
    oder Genitalbereich oder sexuelle Funktionsstörungen?
  advice: Bitte such sofort ärztliche Hilfe, das ist ein Notfall. Die App plant kein Training, bis du
    eine Freigabe bestätigst.
  sources: [D-89, D-92, D-85, D-86]
- id: RF-09
  regions: [lower_back]
  urgency: D
  action: lock
  question: Hattest du schon einmal eine Krebserkrankung, oder hast du ungewollt Gewicht verloren?
  advice: Lass die Rückenschmerzen in den nächsten Tagen ärztlich abklären. Bis du eine Freigabe bestätigst,
    plant die App für diese Region keine Belastung.
  sources: [D-86, D-87]
- id: RF-10
  regions: ['*']
  urgency: N
  action: stop
  question: Hattest du bei Belastung Brustschmerz, ungewohnte Atemnot, Schwindel oder eine Ohnmacht?
  advice: Bitte lass das ärztlich abklären, bevor du weiter trainierst. Die App plant kein Training, bis
    du eine Freigabe bestätigst.
  sources: [D-91]
- id: RF-11
  regions: []
  urgency: A
  action: rtt0
  question: Bestehen deine Beschwerden trotz angepasster Belastung seit mehr als 4 Wochen, oder werden
    sie schlechter?
  advice: Eine Abklärung bei einer Fachperson ist sinnvoll. Bis dahin plant die App für diese Region nur
    Übungen mit geringer Last.
  sources: [D-88, D-73]
- id: RF-12
  regions: [wrist_back_extension, wrist_pinky_side]
  minor_only: true
  urgency: A
  action: rtt0
  question: Hast du seit mehr als 7 Tagen Schmerzen im Handgelenk, wenn du dich darauf stützt?
  advice: Lass das bei einer Fachperson anschauen. Bis dahin pausiert die App Übungen, bei denen du dich
    auf die Hände stützt.
  sources: [D-06, D-07, D-53]
- id: RF-13
  regions: [lower_back]
  minor_only: true
  urgency: A
  action: rtt0
  question: Hast du seit mehr als 7 Tagen Rückenschmerzen bei Übungen, in denen sich der Rücken nach hinten
    biegt (zum Beispiel Brücke)?
  advice: Lass das bei einer Fachperson anschauen. Bis dahin pausiert die App Übungen, bei denen sich
    der Rücken nach hinten biegt.
  sources: [D-82, D-84]
