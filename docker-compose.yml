name: lodestar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lodestar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lodestar}
      # deterministic collation so ORDER BY is identical in dev and CI
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lodestar} -d ${POSTGRES_DB:-lodestar}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL}
      GOOSE_MIGRATION_DIR: /app/db/migrations
    volumes:
      - ./db/migrations:/app/db/migrations:ro
    command: ["goose", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file: .env
    environment:
      LODESTAR_HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${API_PORT_HOST:-8080}:8080"
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/tmp/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LODESTAR_S3_ACCESS_KEY:-lodestar}
      MINIO_ROOT_PASSWORD: ${LODESTAR_S3_SECRET_KEY:?set LODESTAR_S3_SECRET_KEY in .env}
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${LODESTAR_S3_ACCESS_KEY} $${LODESTAR_S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${LODESTAR_S3_BUCKET} &&
      mc anonymous set none local/$${LODESTAR_S3_BUCKET} &&
      echo 'bucket ready'
      "
    environment:
      LODESTAR_S3_ACCESS_KEY: ${LODESTAR_S3_ACCESS_KEY:-lodestar}
      LODESTAR_S3_SECRET_KEY: ${LODESTAR_S3_SECRET_KEY:?set LODESTAR_S3_SECRET_KEY in .env}
      LODESTAR_S3_BUCKET: ${LODESTAR_S3_BUCKET:-lodestar-media}
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT_HOST:-1025}:1025"
      - "${MAILPIT_UI_PORT_HOST:-8025}:8025"

  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${PGWEB_PORT_HOST:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  gomodcache:
