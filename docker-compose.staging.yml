# Staging: the same image as production, on the same host, as its own Compose
# project (ADR 0026). Its own database volume, its own secrets file
# (.env.staging), its own object storage bucket. It has no Caddy: production's
# Caddy reaches the staging API over the shared `hefesto-edge` network and
# serves it as HEFESTO_STAGING_API_DOMAIN. It has no backup sidecar: staging
# data is disposable.
#
# Every merge to main deploys here (.github/workflows/deploy-staging.yml).
# Internal TestFlight builds talk to it.
#
# Used on the server as:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging <cmd>

name: hefesto-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Smaller than production's: it shares the host.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  migrate:
    image: ${HEFESTO_IMAGE:?}:${HEFESTO_TAG:?}
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?}
      GOOSE_MIGRATION_DIR: /srv/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  seed:
    image: ${HEFESTO_IMAGE:?}:${HEFESTO_TAG:?}
    entrypoint: ["/usr/local/bin/seed"]
    command: ["-dir", "/srv/content"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: ${HEFESTO_IMAGE:?}:${HEFESTO_TAG:?}
    restart: unless-stopped
    env_file:
      - path: .env.staging
        required: false
    environment:
      HEFESTO_ENV: staging
      HEFESTO_HTTP_ADDR: ":8080"
      HEFESTO_LOG_FORMAT: json
    expose:
      - "8080"
    networks:
      default: {}
      # Production's Caddy proxies to this alias.
      edge:
        aliases: [staging-api]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging

networks:
  # Created by scripts/deploy.sh when missing, so either environment can be
  # deployed first.
  edge:
    name: hefesto-edge
    external: true

volumes:
  pgdata:
