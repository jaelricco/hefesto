# golangci-lint v2 configuration. CI pins the version in ci.yml.
version: "2"
run:
  tests: true
  build-tags:
    - integration
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wrapcheck
  settings:
    errorlint:
      errorf: true
    gosec:
      excludes:
        - G404
    revive:
      rules:
        - name: package-comments
          disabled: true
    wrapcheck:
      ignore-package-globs:
        - github.com/jaelricco/hefesto/*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
          - wrapcheck
        path: _test\.go
    paths:
      # sqlc-generated code is not ours to lint
      - internal/store/dbgen/
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
